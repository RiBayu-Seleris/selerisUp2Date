<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Warna dasar halaman. Ditulis langsung di sini (bukan di style.css)
         supaya sudah berlaku pada gambar pertama browser, sebelum berkas CSS
         dan JavaScript selesai diunduh. Tanpa ini halaman sempat putih polos
         beberapa saat, lalu warnanya melompat begitu layar loading tampil. -->
    <style>
      html {
        background-color: #f9f9f9;
      }
      html.dark {
        background-color: #17181a;
      }
    </style>

    <!-- Tema tersimpan diterapkan sebelum halaman digambar, supaya tidak ada
         kedipan gelap-ke-terang saat refresh. Sebelumnya kelas "dark" ditulis
         mati di tag <html>, jadi pengunjung mode terang selalu melihat kilatan
         gelap sepersekian detik sampai JavaScript sempat membetulkannya.
         Aturannya HARUS sama persis dengan loadTheme() di src/stores/theme.js —
         kalau berbeda, kedipannya cuma berpindah tempat. -->
    <script>
      (function () {
        try {
          var gelap = localStorage.getItem("isDark") === "true";
          document.documentElement.classList.toggle("dark", gelap);
        } catch (e) {
          /* localStorage diblokir (mode penyamaran) — biarkan mode terang */
        }
      })();
    </script>

    <!-- Title & Description (WAJIB SEO) -->
